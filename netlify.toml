# Despliegue en Netlify (alternativa sin costo a Vercel; ver docs/despliegue.md).
# Netlify detecta Next.js y usa su adaptador oficial (OpenNext); no hace falta instalar plugins.

[build]
  # Genera Prisma, aplica las migraciones pendientes y compila (igual que en Vercel)
  command = "npm run build:produccion"

[build.environment]
  NODE_VERSION = "22"
  # El escaneo de secretos de Netlify sigue activo para todas las demás variables.
  # El nombre de la nube de Cloudinary no es secreto: va en cada URL pública de imagen
  # (res.cloudinary.com/<nombre>/...). Si es una palabra corta, aparece por casualidad en
  # el código compilado y el escaneo detendría el despliegue sin motivo.
  SECRETS_SCAN_OMIT_KEYS = "CLOUDINARY_CLOUD_NAME"
