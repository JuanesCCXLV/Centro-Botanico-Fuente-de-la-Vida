name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      # Base de datos desechable: next build prerenderiza el catálogo y necesita consultarla
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores ficticios solo para CI
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # http://localhost para poder probar el build de producción con `next start` (Lighthouse)
      SITE_URL: "http://localhost:3000"
      ADMIN_EMAIL: "admin@ejemplo.invalid"
      ADMIN_PASSWORD: "clave-solo-para-ci-123"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migraciones y semilla sobre la base de prueba
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Verificar que el esquema y las migraciones coinciden
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run build
      - name: Prueba de respaldo y restauración (CS-16)
        env:
          ORIGEN_URL: ${{ env.DATABASE_URL }}
          RESPALDO_CLAVE: clave-de-prueba-solo-para-ci
        run: |
          scripts/respaldo.sh /tmp/respaldos
          # Restaura el archivo cifrado en una base nueva y comprueba que coincide con el origen
          docker run --rm --network host postgres:16 psql "$DATABASE_URL" -c "CREATE DATABASE restaurada"
          DESTINO_URL="${DATABASE_URL%/*}/restaurada" CONFIRMAR=RESTAURAR scripts/restaurar.sh /tmp/respaldos/*.dump.gpg
          ORIGEN=$(docker run --rm --network host postgres:16 psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM "Producto"')
          COPIA=$(docker run --rm --network host postgres:16 psql "${DATABASE_URL%/*}/restaurada" -Atc 'SELECT count(*) FROM "Producto"')
          echo "Productos en origen: $ORIGEN · en la copia restaurada: $COPIA"
          [ "$ORIGEN" = "$COPIA" ]
          # Con una clave equivocada no se puede descifrar
          ! RESPALDO_CLAVE=otra-clave DESTINO_URL="${DATABASE_URL%/*}/restaurada" CONFIRMAR=RESTAURAR scripts/restaurar.sh /tmp/respaldos/*.dump.gpg
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run test:e2e
      - name: Lighthouse en celular (RNF-09, RNF-11, RNF-12)
        run: npx --yes @lhci/cli@0 autorun
      - name: Resumen de Lighthouse
        if: always()
        run: |
          [ -f .lighthouseci/reportes/manifest.json ] || exit 0
          {
            echo "### Lighthouse (celular, mediana de 3 ejecuciones)"
            echo "| Página | Rendimiento | Accesibilidad | Buenas prácticas | SEO |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | select(.isRepresentativeRun) | "| \(.url | sub("http://localhost:3000"; "")) | \(.summary.performance*100|round) | \(.summary.accessibility*100|round) | \(.summary["best-practices"]*100|round) | \(.summary.seo*100|round) |"' .lighthouseci/reportes/manifest.json
            echo
            echo "**Auditorías no aprobadas (accesibilidad y SEO):**"
            for f in .lighthouseci/reportes/*.report.json; do
              jq -r '. as $r | (.categories.accessibility.auditRefs + .categories.seo.auditRefs)[]
                | select(.weight > 0) | $r.audits[.id] | select(.score != null and .score < 1)
                | "- `\($r.finalDisplayedUrl | sub("http://localhost:3000"; ""))` · \(.id): \(.title)"' "$f"
            done | sort -u
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Subir reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-lighthouse
          path: .lighthouseci/reportes/
          retention-days: 14
          if-no-files-found: ignore
      - name: Subir reporte de Playwright si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
